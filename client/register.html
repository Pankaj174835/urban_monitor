<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Registration - Urban Flood &amp; Smart Drain Monitor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .auth-tab-btn {
      flex: 1;
      padding: 12px 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #64748b;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      background: rgba(37, 99, 235, 0.04);
    }
    .admin-pill {
      background-color: #fee2e2;
      color: #991b1b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-light">

  <div id="main-header"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div class="card card-custom p-0 overflow-hidden shadow">
          <!-- Role Selection Tabs -->
          <div class="d-flex border-bottom bg-white">
            <button type="button" class="auth-tab-btn active" id="tab-reg-citizen">
              <i class="bi bi-person me-1"></i> Citizen Sign Up
            </button>
            <button type="button" class="auth-tab-btn" id="tab-reg-admin">
              <i class="bi bi-shield-lock me-1"></i> Municipal Admin Sign Up <span class="admin-pill ms-1">OFFICIAL</span>
            </button>
          </div>

          <div class="p-4 p-md-5">
            <div class="text-center mb-4">
              <img src="/assets/images/logo.svg" alt="Logo" width="56" height="56" class="mb-2">
              <h3 class="fw-bold text-dark" id="reg-title">Citizen Registration</h3>
              <p class="text-muted small" id="reg-subtitle">Register to report drainage issues, receive flood risk alerts, and track maintenance actions</p>
            </div>

            <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="register-form">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold small text-muted">Full Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control border-start-0" id="name" required placeholder="e.g. Rohan Sharma">
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-muted" id="label-email">Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0" id="email" required placeholder="rohan@example.com">
                </div>
              </div>

              <!-- Citizen Phone Field -->
              <div class="mb-3" id="citizen-phone-group">
                <label for="phone" class="form-label fw-semibold small text-muted">Mobile Number (Optional)</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control border-start-0" id="phone" placeholder="+91 98765 43210">
                </div>
              </div>

              <!-- Municipal Admin Specific Fields -->
              <div id="admin-fields-group" class="d-none">
                <div class="mb-3">
                  <label for="admin-dept" class="form-label fw-semibold small text-muted">Municipal Department / Designation <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-building"></i></span>
                    <input type="text" class="form-control border-start-0" id="admin-dept" placeholder="e.g. Stormwater Drainage Division / Ward Officer">
                  </div>
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center">
                    <label for="municipal-code" class="form-label fw-semibold small text-muted mb-0">Department Verification Code <span class="text-danger">*</span></label>
                    <span class="badge bg-secondary-subtle text-secondary small">Code: MUNICIPAL2026</span>
                  </div>
                  <div class="input-group mt-1">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control border-start-0" id="municipal-code" placeholder="Enter official department passcode">
                  </div>
                  <div class="form-text small text-muted">Enter official passcode <code>MUNICIPAL2026</code> to authorize municipal administrative access.</div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="password" class="form-label fw-semibold small text-muted">Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" required minlength="6" placeholder="Min 6 characters">
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="confirmPassword" class="form-label fw-semibold small text-muted">Confirm Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="confirmPassword" required minlength="6" placeholder="Re-type password">
                  </div>
                </div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                <label class="form-check-label small text-muted" for="termsCheck" id="label-terms">
                  I agree to submit genuine civic drainage reports and receive system-generated risk notifications.
                </label>
              </div>

              <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mt-2">
                <span id="btn-text">Create Citizen Account</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
              </button>
            </form>

            <div class="text-center mt-4 text-muted small" id="auth-signin-link">
              Already registered? <a href="/login.html?role=citizen" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    let activeRole = 'citizen';

    function setRole(role) {
      activeRole = role;
      const tabCitizen = document.getElementById('tab-reg-citizen');
      const tabAdmin = document.getElementById('tab-reg-admin');
      const title = document.getElementById('reg-title');
      const subtitle = document.getElementById('reg-subtitle');
      const labelEmail = document.getElementById('label-email');
      const emailInput = document.getElementById('email');
      const btnText = document.getElementById('btn-text');
      const citizenPhone = document.getElementById('citizen-phone-group');
      const adminFields = document.getElementById('admin-fields-group');
      const labelTerms = document.getElementById('label-terms');
      const signinLink = document.getElementById('auth-signin-link');

      document.getElementById('register-alert').classList.add('d-none');

      if (role === 'admin') {
        tabAdmin.classList.add('active');
        tabCitizen.classList.remove('active');
        title.textContent = 'Municipal Admin Sign Up';
        subtitle.textContent = 'Register an authorized municipal officer account to manage city-wide drainage complaints and maintenance lifecycle';
        labelEmail.textContent = 'Official Municipal Email Address';
        emailInput.placeholder = 'official.name@citydrain.gov.in';
        btnText.textContent = 'Create Municipal Admin Account';
        citizenPhone.classList.add('d-none');
        adminFields.classList.remove('d-none');
        document.getElementById('municipal-code').value = 'MUNICIPAL2026';
        labelTerms.textContent = 'I certify that I am an authorized municipal operations officer for urban drainage management.';
        signinLink.innerHTML = 'Already registered as Admin? <a href="/login.html?role=admin" class="text-primary fw-semibold text-decoration-none">Sign in as Municipal Admin</a>';
      } else {
        tabCitizen.classList.add('active');
        tabAdmin.classList.remove('active');
        title.textContent = 'Citizen Registration';
        subtitle.textContent = 'Register to report drainage issues, receive flood risk alerts, and track maintenance actions';
        labelEmail.textContent = 'Citizen Email Address';
        emailInput.placeholder = 'rohan@example.com';
        btnText.textContent = 'Create Citizen Account';
        citizenPhone.classList.remove('d-none');
        adminFields.classList.add('d-none');
        labelTerms.textContent = 'I agree to submit genuine civic drainage reports and receive system-generated risk notifications.';
        signinLink.innerHTML = 'Already registered as Citizen? <a href="/login.html?role=citizen" class="text-primary fw-semibold text-decoration-none">Sign in as Citizen</a>';
      }
    }

    document.getElementById('tab-reg-citizen').addEventListener('click', () => setRole('citizen'));
    document.getElementById('tab-reg-admin').addEventListener('click', () => setRole('admin'));

    // Check URL parameters on load
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'admin') {
      setRole('admin');
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('register-alert');
      const btn = document.getElementById('register-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      alertBox.classList.add('d-none');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const phone = document.getElementById('phone').value.trim();
      const municipalCode = document.getElementById('municipal-code').value.trim();

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match. Please re-enter.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (activeRole === 'admin' && !municipalCode) {
        alertBox.textContent = 'Municipal Department Verification Code is required for admin accounts.';
        alertBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btnSpinner.classList.remove('d-none');

      try {
        const payload = {
          name,
          email,
          phone,
          password,
          confirmPassword,
          role: activeRole,
          municipalCode: activeRole === 'admin' ? municipalCode : undefined
        };

        const res = await API.post('/api/auth/register', payload);

        if (res.success && res.token && res.user) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));

          API.showToast(`Account created as ${res.user.role.toUpperCase()}`, 'success');

          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = '/admin-dashboard.html';
            } else {
              window.location.href = '/citizen-dashboard.html';
            }
          }, 400);
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed. Please check your inputs.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>

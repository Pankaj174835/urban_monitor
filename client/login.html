<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Authentication - Urban Flood &amp; Smart Drain Monitor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .auth-tab-btn {
      flex: 1;
      padding: 10px 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #64748b;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      background: rgba(37, 99, 235, 0.04);
    }
    .admin-pill {
      background-color: #fee2e2;
      color: #991b1b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-light">

  <div id="main-header"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card card-custom p-0 overflow-hidden shadow">
          <!-- Role Selection Tabs -->
          <div class="d-flex border-bottom bg-white">
            <button type="button" class="auth-tab-btn active" id="tab-citizen">
              <i class="bi bi-person me-1"></i> Citizen Sign In
            </button>
            <button type="button" class="auth-tab-btn" id="tab-admin">
              <i class="bi bi-shield-lock me-1"></i> Municipal Admin <span class="admin-pill ms-1">OFFICIAL</span>
            </button>
          </div>

          <div class="p-4 p-md-5">
            <div class="text-center mb-4">
              <img src="/assets/images/logo.svg" alt="Logo" width="56" height="56" class="mb-2">
              <h3 class="fw-bold text-dark" id="login-title">Citizen Sign In</h3>
              <p class="text-muted small" id="login-subtitle">Access your citizen account to report drainage issues and track resolution</p>
            </div>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-muted" id="label-email">Citizen Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0" id="email" required placeholder="name@example.com">
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control border-start-0" id="password" required placeholder="••••••••">
                </div>
              </div>

              <div id="admin-helper-box" class="p-2 mb-3 bg-light border rounded small text-muted d-none">
                <i class="bi bi-info-circle me-1 text-primary"></i>
                <span>Default Municipal Admin: <strong>admin@citydrain.gov.in</strong> | Password: <strong>Admin@123</strong></span>
                <button type="button" class="btn btn-link btn-sm p-0 ms-1 fw-bold text-decoration-none" id="btn-autofill-admin">Autofill</button>
              </div>

              <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mt-2">
                <span id="btn-text">Sign In as Citizen</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
              </button>
            </form>

            <div class="text-center mt-4 text-muted small" id="auth-footer-link">
              Don't have a citizen account? <a href="/register.html?role=citizen" class="text-primary fw-semibold text-decoration-none">Register as Citizen</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    let activeRole = 'citizen';

    function setRole(role) {
      activeRole = role;
      const tabCitizen = document.getElementById('tab-citizen');
      const tabAdmin = document.getElementById('tab-admin');
      const title = document.getElementById('login-title');
      const subtitle = document.getElementById('login-subtitle');
      const labelEmail = document.getElementById('label-email');
      const emailInput = document.getElementById('email');
      const btnText = document.getElementById('btn-text');
      const adminHelper = document.getElementById('admin-helper-box');
      const footerLink = document.getElementById('auth-footer-link');

      document.getElementById('login-alert').classList.add('d-none');

      if (role === 'admin') {
        tabAdmin.classList.add('active');
        tabCitizen.classList.remove('active');
        title.textContent = 'Municipal Admin Sign In';
        subtitle.textContent = 'Authorized Municipal Drainage Operations & Command Portal';
        labelEmail.textContent = 'Municipal Official Email';
        emailInput.placeholder = 'admin@citydrain.gov.in';
        emailInput.value = 'admin@citydrain.gov.in';
        document.getElementById('password').value = 'Admin@123';
        btnText.textContent = 'Sign In as Municipal Admin';
        adminHelper.classList.remove('d-none');
        footerLink.innerHTML = 'Need a Municipal Official account? <a href="/register.html?role=admin" class="text-primary fw-semibold text-decoration-none">Sign up as Municipal Admin</a>';
      } else {
        tabCitizen.classList.add('active');
        tabAdmin.classList.remove('active');
        title.textContent = 'Citizen Sign In';
        subtitle.textContent = 'Access your citizen account to report drainage issues and track resolution';
        labelEmail.textContent = 'Citizen Email Address';
        emailInput.placeholder = 'name@example.com';
        emailInput.value = '';
        document.getElementById('password').value = '';
        btnText.textContent = 'Sign In as Citizen';
        adminHelper.classList.add('d-none');
        footerLink.innerHTML = 'Don\'t have a citizen account? <a href="/register.html?role=citizen" class="text-primary fw-semibold text-decoration-none">Register as Citizen</a>';
      }
    }

    document.getElementById('tab-citizen').addEventListener('click', () => setRole('citizen'));
    document.getElementById('tab-admin').addEventListener('click', () => setRole('admin'));

    document.getElementById('btn-autofill-admin').addEventListener('click', () => {
      document.getElementById('email').value = 'admin@citydrain.gov.in';
      document.getElementById('password').value = 'Admin@123';
    });

    // Check URL parameters on load
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'admin') {
      setRole('admin');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btnSpinner.classList.remove('d-none');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/api/auth/login', { email, password });
        if (res.success && res.token && res.user) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));

          API.showToast(`Authenticated as ${res.user.name} (${res.user.role.toUpperCase()})`, 'success');

          const redirectUrl = urlParams.get('redirect');

          setTimeout(() => {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            } else if (res.user.role === 'admin') {
              window.location.href = '/admin-dashboard.html';
            } else {
              window.location.href = '/citizen-dashboard.html';
            }
          }, 400);
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid email or password credentials.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>

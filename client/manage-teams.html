<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Maintenance Teams - Urban Flood &amp; Smart Drain Monitor</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <div id="main-header"></div>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar" id="dashboard-sidebar"></aside>

    <main class="dashboard-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb small">
              <li class="breadcrumb-item"><a href="/admin-dashboard.html">Admin Console</a></li>
              <li class="breadcrumb-item active">Maintenance Teams</li>
            </ol>
          </nav>
          <div class="d-flex align-items-center gap-2">
            <h2 class="fw-bold text-dark mb-0">Maintenance &amp; Cleaning Units</h2>
          </div>
          <p class="text-muted small mb-0 mt-1">Manage field drainage taskforces, equipment units, and area assignments</p>
        </div>
        <div>
          <button class="btn btn-primary fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCreateTeam">
            <i class="bi bi-person-plus-fill me-1"></i> Add Maintenance Team
          </button>
        </div>
      </div>

      <!-- Teams Grid -->
      <div id="teams-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Loading municipal maintenance teams...</p>
      </div>

      <div class="row g-4" id="teams-grid"></div>
    </main>
  </div>

  <!-- Modal: Create Team -->
  <div class="modal fade" id="modalCreateTeam" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Register New Maintenance Unit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="create-team-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Team Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="new-team-name" required placeholder="e.g. Nalasopara Silt Clearance Squad">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Leader / Supervisor Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="new-leader-name" required placeholder="e.g. Ramesh Kadam">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Contact Phone</label>
              <input type="tel" class="form-control" id="new-team-phone" placeholder="+91 98200 11223">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Assigned Municipal Sector</label>
              <input type="text" class="form-control" id="new-team-area" placeholder="e.g. Nalasopara East &amp; Pelhar Culverts">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Staff / Worker Count</label>
              <input type="number" class="form-control" id="new-member-count" value="5" min="1" max="25">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm fw-bold">Create Team</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    async function loadTeams() {
      try {
        const res = await API.get('/api/teams');
        document.getElementById('teams-loading').classList.add('d-none');
        const grid = document.getElementById('teams-grid');
        grid.innerHTML = '';

        const teams = res.teams || [];
        teams.forEach(t => {
          const statusColors = {
            AVAILABLE: 'bg-success text-white',
            ON_DUTY: 'bg-warning text-dark',
            OFF_DUTY: 'bg-secondary text-white'
          };

          const col = document.createElement('div');
          col.className = 'col-md-6 col-xl-4';
          col.innerHTML = `
            <div class="card card-custom p-4 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge ${statusColors[t.status] || 'bg-light text-dark'} text-uppercase px-2 py-1">${t.status}</span>
                <span class="small text-muted"><i class="bi bi-people-fill me-1"></i>${t.memberCount || 5} workers</span>
              </div>
              <h5 class="fw-bold text-dark mb-1">${t.name}</h5>
              <div class="small text-muted mb-3"><i class="bi bi-geo-alt me-1"></i>${t.assignedArea || 'Zone Corridors'}</div>
              
              <div class="p-3 bg-light rounded-3 mb-3 border">
                <div class="d-flex justify-content-between small mb-1">
                  <span class="text-muted">Supervisor:</span>
                  <span class="fw-semibold text-dark">${t.leaderName}</span>
                </div>
                <div class="d-flex justify-content-between small mb-1">
                  <span class="text-muted">Direct Line:</span>
                  <span class="font-monospace text-primary">${t.contactNumber || 'N/A'}</span>
                </div>
                <div class="d-flex justify-content-between small">
                  <span class="text-muted">Active Work Orders:</span>
                  <span class="fw-bold text-warning">${t.activeTasksCount || 0}</span>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                <span class="small text-success"><i class="bi bi-check-circle-fill me-1"></i>${t.completedTasksCount || 0} Resolved</span>
              </div>
            </div>
          `;
          grid.appendChild(col);
        });
      } catch (err) {
        document.getElementById('teams-loading').innerHTML = `
          <div class="alert alert-danger mb-0">${err.message || 'Error loading teams'}</div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth(['admin'])) return;
      Auth.renderSidebar('manage-teams');
      loadTeams();

      document.getElementById('create-team-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('new-team-name').value;
        const leaderName = document.getElementById('new-leader-name').value;
        const contactNumber = document.getElementById('new-team-phone').value;
        const assignedArea = document.getElementById('new-team-area').value;
        const memberCount = document.getElementById('new-member-count').value;

        try {
          await API.post('/api/teams', { name, leaderName, contactNumber, assignedArea, memberCount });
          bootstrap.Modal.getInstance(document.getElementById('modalCreateTeam')).hide();
          API.showToast('Maintenance team registered successfully!', 'success');
          loadTeams();
        } catch (err) {
          alert(err.message);
        }
      });
    });
  </script>
</body>
</html>
